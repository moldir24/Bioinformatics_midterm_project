# Conda environment for the whole pipeline (Linux x86-64).
#   conda env create -f environment.yml && conda activate alnfail
# After creating it, freeze what was installed and commit the file:
#   conda env export --no-builds > environment.lock.yml
name: alnfail
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake-minimal>=8.20
  - numpy>=1.26
  - pandas>=2.2
  - pyarrow>=15
  - matplotlib-base>=3.8
  - pysam>=0.22
  - pytest>=8
  # lower bounds are the versions the pipeline was developed against
  - samtools>=1.19.2,<2
  - minimap2>=2.26,<3
  - bwa-mem2>=2.2.1
  - bwa>=0.7.17
  - bowtie2>=2.5.4
  - strobealign>=0.14,<0.17
  - winnowmap=2.03
  - ngmlr=0.2.7
  - fastp>=0.23.4,<1
  - curl
  - pigz
